name: Instalador Windows (Apollo-PDV-Setup.exe)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências do aplicativo desktop
        working-directory: desktop
        run: yarn install
      - name: Gerar instalador
        working-directory: desktop
        env:
          # Defina em Settings → Secrets and variables → Actions → Variables (endereço publicado do sistema)
          PDV_SERVER_URL: ${{ vars.PDV_SERVER_URL }}
        run: yarn dist
      - uses: actions/upload-artifact@v4
        with:
          name: Apollo-PDV-Setup
          path: desktop/dist/Apollo-PDV-Setup.exe
          if-no-files-found: error
