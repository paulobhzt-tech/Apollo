name: Instalador Windows (Apollo-PDV-Setup.exe)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Tipo do instalador: teste local ou producao HTTPS"
        type: choice
        required: true
        default: production
        options:
          - test
          - production
  push:
    branches: ["fix/windows-production-server"]
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Definir servidor e canal do instalador
        shell: pwsh
        env:
          REQUESTED_CHANNEL: ${{ inputs.channel }}
          PUBLISHED_URL: ${{ vars.PDV_SERVER_URL || 'https://pdv.apollo-pdv.com' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $channel = if ($env:EVENT_NAME -eq "workflow_dispatch") { $env:REQUESTED_CHANNEL } else { "production" }
          if ($channel -eq "test") {
            "PDV_BUILD_CHANNEL=test" >> $env:GITHUB_ENV
            "PDV_SERVER_URL=http://localhost:18080" >> $env:GITHUB_ENV
            Write-Host "Instalador de TESTE: exige tunel SSH aberto em localhost:18080"
          } elseif ($channel -eq "production") {
            if ($env:PUBLISHED_URL -notmatch '^https://') { throw "Configure PDV_SERVER_URL como HTTPS nas variaveis Actions" }
            $uri = $null
            if (-not [System.Uri]::TryCreate($env:PUBLISHED_URL, [System.UriKind]::Absolute, [ref]$uri) -or
                $uri.Scheme -ne "https" -or $uri.Host -in @("localhost", "127.0.0.1", "::1") -or
                $uri.UserInfo -or $uri.Query -or $uri.Fragment -or $uri.AbsolutePath -ne "/") {
              throw "PDV_SERVER_URL deve ser uma URL HTTPS publica sem caminho ou credenciais"
            }
            "PDV_BUILD_CHANNEL=production" >> $env:GITHUB_ENV
            "PDV_SERVER_URL=$env:PUBLISHED_URL" >> $env:GITHUB_ENV
            Write-Host "Instalador de PRODUCAO: servidor HTTPS configurado"
          } else {
            throw "Canal invalido"
          }
      - name: Validar API de producao antes de empacotar
        if: env.PDV_BUILD_CHANNEL == 'production'
        shell: pwsh
        run: |
          $endpoint = "$env:PDV_SERVER_URL/api/"
          try {
            $response = Invoke-RestMethod -Uri $endpoint -Method Get -TimeoutSec 15
          } catch {
            throw "Servidor Apollo indisponivel em $endpoint. Instalador de producao cancelado: $_"
          }
          if ($response.message -notin @("API Apollo PDV", "Apollo PDV API")) {
            throw "A URL configurada nao retornou a API Apollo. Instalador de producao cancelado."
          }
      - name: Instalar dependencias do aplicativo desktop
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Verificar sintaxe dos scripts desktop
        working-directory: desktop
        run: |
          node --check scripts/build-web.js
          node --check main.js
          node --check preload.js
      - name: Testar deteccao do servidor e atualizacao da configuracao
        working-directory: desktop
        run: node --test scripts/server-connection.test.js
      - name: Gerar instalador
        working-directory: desktop
        run: npm run dist
      - name: Conferir executavel gerado
        shell: pwsh
        run: |
          $file = "desktop/dist/Apollo-PDV-Setup.exe"
          if (-not (Test-Path $file)) { throw "Instalador nao encontrado" }
          Get-FileHash $file -Algorithm SHA256 | Format-List
      - name: Homologar instalacao e inicializacao em Windows virtual
        shell: pwsh
        env:
          PDV_SMOKE: offline
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path 'desktop/dist/Apollo-PDV-Setup.exe').Path
          $dir = Join-Path $env:RUNNER_TEMP 'ApolloSmoke'
          Write-Host "Runner: $([Environment]::OSVersion.VersionString)"
          Write-Host "Instalador: $setup"
          Write-Host "Destino: $dir"
          # NSIS requires /D=path as the LAST argument, with no quoting of the path.
          $installer = Start-Process -FilePath $setup -ArgumentList "/S /D=$dir" -PassThru -Wait
          Write-Host "NSIS exit code: $($installer.ExitCode)"
          if ($installer.ExitCode -ne 0) {
            Write-Host 'Arquivos encontrados apos tentativa de instalacao:'
            Get-ChildItem -Path $dir -Force -ErrorAction SilentlyContinue | Select-Object Name,Length | Format-Table
            $crash = Join-Path $env:RUNNER_TEMP 'apollo-installer-diagnostics.txt'
            "NSIS exit code: $($installer.ExitCode)`nSetup: $setup`nTarget: $dir`nWindows: $([Environment]::OSVersion.VersionString)" | Set-Content $crash
            throw "Instalacao NSIS falhou: $($installer.ExitCode)"
          }
          $app = Join-Path $dir 'Apollo PDV.exe'
          if (-not (Test-Path $app)) { throw "Apollo PDV.exe nao foi instalado" }
          $stdout = Join-Path $env:RUNNER_TEMP 'apollo-smoke-out.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'apollo-smoke-err.txt'
          $process = Start-Process -FilePath $app -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $deadline = (Get-Date).AddSeconds(90)
            do {
              Start-Sleep -Seconds 2
              $process.Refresh()
            } while (-not $process.HasExited -and (Get-Date) -lt $deadline)
            if (-not $process.HasExited) { throw 'Apollo nao encerrou o smoke test em 90 segundos' }
            $output = Get-Content $stdout -Raw -ErrorAction SilentlyContinue
            Write-Host $output
            if ($process.ExitCode -ne 0) { throw "Apollo falhou ao iniciar: $($process.ExitCode)" }
            if ($output -notmatch 'PDV_SMOKE_PASS') { throw 'Apollo nao confirmou tela offline e ponte desktop' }
            Write-Host 'HOMOLOGACAO BASICA WINDOWS APROVADA'
          } finally {
            Get-CimInstance Win32_Process | Where-Object {
              $_.Name -eq 'Apollo PDV.exe' -and $_.ExecutablePath -like "$dir*"
            } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Apollo-PDV-Setup-${{ env.PDV_BUILD_CHANNEL }}
          path: |
            desktop/dist/Apollo-PDV-Setup.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 14
      - name: Publicar logs da homologacao Windows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apollo-windows-smoke-logs
          path: |
            ${{ runner.temp }}/apollo-smoke-out.txt
            ${{ runner.temp }}/apollo-smoke-err.txt
            ${{ runner.temp }}/apollo-installer-diagnostics.txt
          if-no-files-found: ignore
          retention-days: 14
