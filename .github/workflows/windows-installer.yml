name: Instalador Windows (Apollo-PDV-Setup.exe)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Tipo do instalador: teste local ou producao HTTPS"
        type: choice
        required: true
        default: test
        options:
          - test
          - production
  push:
    branches: ["fix/windows-production-server", "feat/apollo-3.0.1-caixa-offline-auditoria"]
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-2025
    permissions:
      contents: read
      actions: read
    outputs:
      channel: ${{ steps.channel.outputs.name }}
      sha256: ${{ steps.installer.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Definir servidor e canal do instalador
        id: channel
        shell: pwsh
        env:
          REQUESTED_CHANNEL: ${{ inputs.channel }}
          PUBLISHED_URL: ${{ vars.PDV_SERVER_URL || 'https://pdv.apollo-pdv.com' }}
          BUILD_REF: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $channel = if ($env:EVENT_NAME -eq "workflow_dispatch") { $env:REQUESTED_CHANNEL } else { "production" }
          if ($env:BUILD_REF -eq "feat/apollo-3.0.1-caixa-offline-auditoria") { $channel = "test" }
          if ($channel -eq "test") {
            "PDV_BUILD_CHANNEL=test" >> $env:GITHUB_ENV
            "PDV_SERVER_URL=http://localhost:18080" >> $env:GITHUB_ENV
            Write-Host "Instalador de TESTE: exige tunel SSH aberto em localhost:18080"
          } elseif ($channel -eq "production") {
            if ($env:PUBLISHED_URL -notmatch '^https://') { throw "Configure PDV_SERVER_URL como HTTPS nas variaveis Actions" }
            $uri = $null
            if (-not [System.Uri]::TryCreate($env:PUBLISHED_URL, [System.UriKind]::Absolute, [ref]$uri) -or
                $uri.Scheme -ne "https" -or $uri.Host -in @("localhost", "127.0.0.1", "::1") -or
                $uri.UserInfo -or $uri.Query -or $uri.Fragment -or $uri.AbsolutePath -ne "/") {
              throw "PDV_SERVER_URL deve ser uma URL HTTPS publica sem caminho ou credenciais"
            }
            "PDV_BUILD_CHANNEL=production" >> $env:GITHUB_ENV
            "PDV_SERVER_URL=$env:PUBLISHED_URL" >> $env:GITHUB_ENV
            Write-Host "Instalador de PRODUCAO: servidor HTTPS configurado"
          } else {
            throw "Canal invalido"
          }
          "name=$channel" >> $env:GITHUB_OUTPUT
      - name: Validar API de producao antes de empacotar
        if: env.PDV_BUILD_CHANNEL == 'production'
        shell: pwsh
        run: |
          $endpoint = "$env:PDV_SERVER_URL/api/"
          try {
            $response = Invoke-RestMethod -Uri $endpoint -Method Get -TimeoutSec 15
          } catch {
            throw "Servidor Apollo indisponivel em $endpoint. Instalador de producao cancelado: $_"
          }
          if ($response.message -notin @("API Apollo PDV", "Apollo PDV API")) {
            throw "A URL configurada nao retornou a API Apollo. Instalador de producao cancelado."
          }
      - name: Instalar dependencias do aplicativo desktop
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Verificar sintaxe dos scripts desktop
        working-directory: desktop
        run: |
          node --check scripts/build-web.js
          node --check main.js
          node --check preload.js
      - name: Testar deteccao do servidor e atualizacao da configuracao
        working-directory: desktop
        run: node --test scripts/server-connection.test.js scripts/durable-store.test.js scripts/exit-queue.test.js
      - name: Validar frontend antes de gerar o instalador
        working-directory: frontend
        shell: pwsh
        run: |
          corepack enable
          yarn install --non-interactive
          yarn typecheck
          yarn vitest run src/lib/offline.test.ts src/lib/queue-context.test.ts src/lib/legacy-reconciliation.test.ts
      - name: Aguardar CI do mesmo commit de homologacao
        if: github.ref_name == 'feat/apollo-3.0.1-caixa-offline-auditoria'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $checks = @('quality-checks.yml', 'validacao-pdv.yml', 'apollo-pwa-validation.yml')
          $deadline = (Get-Date).AddMinutes(12)
          do {
            $pending = @()
            foreach ($check in $checks) {
              $result = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/$check/runs?head_sha=$env:GITHUB_SHA&event=push&per_page=10"
              if ($LASTEXITCODE -ne 0) { throw "Nao foi possivel consultar $check" }
              $run = ($result | ConvertFrom-Json).workflow_runs | Select-Object -First 1
              if (-not $run -or $run.status -ne 'completed') { $pending += $check; continue }
              if ($run.conclusion -ne 'success') { throw "$check terminou com $($run.conclusion)" }
            }
            if (-not $pending.Count) { break }
            if ((Get-Date) -ge $deadline) { throw "CI pendente: $($pending -join ', ')" }
            Start-Sleep -Seconds 15
          } while ($true)
      - name: Gerar instalador
        working-directory: desktop
        run: npm run dist
      - name: Conferir executavel gerado
        id: installer
        shell: pwsh
        run: |
          $file = "desktop/dist/Apollo-PDV-Setup.exe"
          if (-not (Test-Path $file)) { throw "Instalador nao encontrado" }
          $hash = Get-FileHash $file -Algorithm SHA256
          $hash | Format-List
          "sha256=$($hash.Hash)" >> $env:GITHUB_OUTPUT
      - name: Testar instalacao e abertura no Windows Server 2025
        shell: pwsh
        run: ./desktop/scripts/windows-smoke.ps1 -Installer desktop/dist/Apollo-PDV-Setup.exe -Channel $env:PDV_BUILD_CHANNEL
      - uses: actions/upload-artifact@v4
        with:
          name: Apollo-PDV-Setup-${{ env.PDV_BUILD_CHANNEL }}
          path: |
            desktop/dist/Apollo-PDV-Setup.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 14
      - name: Publicar logs da homologacao Windows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apollo-windows-smoke-logs
          path: |
            ${{ runner.temp }}/apollo-smoke-out.txt
            ${{ runner.temp }}/apollo-smoke-err.txt
            ${{ runner.temp }}/apollo-installer-diagnostics.txt
          if-no-files-found: ignore
          retention-days: 14

  smoke-windows-2022:
    needs: build-windows
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Apollo-PDV-Setup-${{ needs.build-windows.outputs.channel }}
          path: desktop/dist
      - name: Conferir o mesmo instalador e testar no Windows Server 2022
        shell: pwsh
        env:
          EXPECTED_SHA256: ${{ needs.build-windows.outputs.sha256 }}
          INSTALLER_CHANNEL: ${{ needs.build-windows.outputs.channel }}
        run: |
          $installer = 'desktop/dist/Apollo-PDV-Setup.exe'
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $env:EXPECTED_SHA256) {
            throw 'O instalador baixado difere do instalador testado no Windows Server 2025'
          }
          ./desktop/scripts/windows-smoke.ps1 -Installer $installer -Channel $env:INSTALLER_CHANNEL
      - name: Publicar logs do teste Windows Server 2022
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apollo-windows-2022-smoke-logs
          path: |
            ${{ runner.temp }}/apollo-smoke-out.txt
            ${{ runner.temp }}/apollo-smoke-err.txt
            ${{ runner.temp }}/apollo-installer-diagnostics.txt
          if-no-files-found: ignore
          retention-days: 14
