name: P63 - Auditoria visual
on:
  push:
    branches: [feat/p63-interface-completa-consumer]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      MONGO_URL: mongodb://127.0.0.1:27017/?replicaSet=p63
      DB_NAME: apollo_p40_browser_p63
      APOLLO_CASH_MODE: operator
      APOLLO_E2E_BASE_URL: https://127.0.0.1:8001
      COOKIE_SECURE: 'true'
      CORS_ORIGINS: https://127.0.0.1:8001
      P47_BROWSER: ${{ matrix.browser }}
      SERVE_FRONTEND_DIR: ${{ github.workspace }}/frontend/dist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and install the test browser
        run: |
          python -m pip install -r backend/requirements.txt --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
          npm --prefix frontend ci --legacy-peer-deps --no-audit --no-fund
          npm --prefix frontend run build
          npm --prefix tests ci --no-audit --no-fund
          cd tests
          npx playwright install --with-deps "$P47_BROWSER"
      - name: Start transactional test database
        run: |
          docker run -d --name apollo-p63-mongo -p 127.0.0.1:27017:27017 mongo:7 --replSet p63 --bind_ip_all
          for attempt in {1..30}; do
            if docker exec apollo-p63-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec apollo-p63-mongo mongosh --quiet --eval 'rs.initiate({_id:"p63",members:[{_id:0,host:"localhost:27017"}]})'
          for attempt in {1..30}; do
            if docker exec apollo-p63-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run visual checks with fictitious data
        run: |
          mkdir -p evidence
          python local-server/gerar-certificado.py /tmp/apollo-p63-tls 127.0.0.1
          python backend/p40_seed_ci.py
          (
            cd backend
            exec python -m uvicorn server:app --host 127.0.0.1 --port 8001 --ssl-keyfile /tmp/apollo-p63-tls/server.key --ssl-certfile /tmp/apollo-p63-tls/server.crt
          ) > evidence/backend.log 2>&1 &
          server_pid=$!
          trap 'if kill -0 "$server_pid" 2>/dev/null; then kill "$server_pid"; fi' EXIT
          for attempt in {1..30}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat evidence/backend.log
              exit 1
            fi
            if curl --cacert /tmp/apollo-p63-tls/apollo-local-ca.crt --fail --silent "$APOLLO_E2E_BASE_URL/api/" > evidence/health.json; then
              break
            fi
            sleep 1
          done
          test -s evidence/health.json || { cat evidence/backend.log; exit 1; }
          cd tests
          specs=(p63-visual.spec.ts p63-quantity-footer.spec.ts p63-selected-items.spec.ts)
          if [[ "$P47_BROWSER" == chromium ]]; then specs+=(p64-display-payment.spec.ts); fi
          if [[ "$P47_BROWSER" == chromium && ( "$GITHUB_REF_NAME" == feat/p64-3-interface-impressao-final || "$GITHUB_REF_NAME" == feat/p64-4-liberacao-final-apollo ) ]]; then
            specs+=(p64-print-agent.spec.ts)
          fi
          npx playwright test --config=p47.config.ts "${specs[@]}" --trace retain-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Apollo-P63-${{ matrix.browser }}
          path: |
            tests/test-results/p47/
            evidence/
          retention-days: 14
