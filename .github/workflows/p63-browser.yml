name: P63 - Auditoria visual
on:
  push:
    branches: [feat/p63-interface-completa-consumer, feat/p64-4-finalizacao-liberacao-operacional, feat/p64-5-interface-consumer-operacional, feat/p64-6-finalizacao-interface-homologacao-operacional, feat/p64-7-reconstrucao-completa-interface-consumer, feat/p64-8-correcao-final-homologacao, feat/p64-9-reconstrucao-integral-interface-consumer]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      MONGO_URL: mongodb://127.0.0.1:27017/?replicaSet=p63
      DB_NAME: apollo_p40_browser_p63
      APOLLO_CASH_MODE: operator
      APOLLO_E2E_BASE_URL: https://127.0.0.1:8001
      COOKIE_SECURE: 'true'
      CORS_ORIGINS: https://127.0.0.1:8001
      P47_BROWSER: ${{ matrix.browser }}
      SERVE_FRONTEND_DIR: ${{ github.workspace }}/frontend/dist
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and install the test browser
        run: |
          python -m pip install -r backend/requirements.txt --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
          npm --prefix frontend ci --legacy-peer-deps --no-audit --no-fund
          npm --prefix frontend run build
          npm --prefix tests ci --no-audit --no-fund
          cd tests
          npx playwright install --with-deps "$P47_BROWSER"
      - name: Start transactional test database
        run: |
          docker run -d --name apollo-p63-mongo -p 127.0.0.1:27017:27017 mongo:7 --replSet p63 --bind_ip_all
          for attempt in {1..30}; do
            if docker exec apollo-p63-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec apollo-p63-mongo mongosh --quiet --eval 'rs.initiate({_id:"p63",members:[{_id:0,host:"localhost:27017"}]})'
          for attempt in {1..30}; do
            if docker exec apollo-p63-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Executar bateria completa do backend em bancos descartáveis
        if: github.ref_name == 'feat/p64-9-reconstrucao-integral-interface-consumer' && matrix.browser == 'chromium'
        env:
          APOLLO_DISPOSABLE_TESTS: '1'
        run: |
          set -o pipefail
          mkdir -p evidence
          bash backend/scripts/test-full-disposable.sh 2>&1 | tee evidence/backend-completo.log
      - name: Run visual checks with fictitious data
        run: |
          mkdir -p evidence
          python local-server/gerar-certificado.py /tmp/apollo-p63-tls 127.0.0.1
          python backend/p40_seed_ci.py
          (
            cd backend
            exec python -m uvicorn server:app --host 127.0.0.1 --port 8001 --ssl-keyfile /tmp/apollo-p63-tls/server.key --ssl-certfile /tmp/apollo-p63-tls/server.crt
          ) > evidence/backend.log 2>&1 &
          server_pid=$!
          trap 'if kill -0 "$server_pid" 2>/dev/null; then kill "$server_pid"; fi' EXIT
          for attempt in {1..30}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat evidence/backend.log
              exit 1
            fi
            if curl --cacert /tmp/apollo-p63-tls/apollo-local-ca.crt --fail --silent "$APOLLO_E2E_BASE_URL/api/" > evidence/health.json; then
              break
            fi
            sleep 1
          done
          test -s evidence/health.json || { cat evidence/backend.log; exit 1; }
          cd tests
          specs=(p63-visual.spec.ts p63-quantity-footer.spec.ts p63-selected-items.spec.ts)
          if [[ "$P47_BROWSER" == chromium ]]; then
            specs+=(p64-display-payment.spec.ts)
            if [[ "$GITHUB_REF_NAME" == feat/p64-9-reconstrucao-integral-interface-consumer ]]; then
              specs+=(operator-session.spec.ts)
            fi
          fi
          if [[ "$P47_BROWSER" == chromium && ( "$GITHUB_REF_NAME" == feat/p64-9-reconstrucao-integral-interface-consumer || "$GITHUB_REF_NAME" == feat/p64-3-interface-impressao-final || "$GITHUB_REF_NAME" == feat/p64-4-liberacao-final-apollo || "$GITHUB_REF_NAME" == feat/p64-4-finalizacao-liberacao-operacional || "$GITHUB_REF_NAME" == feat/p64-5-interface-consumer-operacional || "$GITHUB_REF_NAME" == feat/p64-6-finalizacao-interface-homologacao-operacional || "$GITHUB_REF_NAME" == feat/p64-7-reconstrucao-completa-interface-consumer || "$GITHUB_REF_NAME" == feat/p64-8-correcao-final-homologacao ) ]]; then
            specs+=(p64-print-agent.spec.ts)
          fi
          npx playwright test --config=p47.config.ts "${specs[@]}" --trace retain-on-failure
      - name: Testar interrupção HTTPS com banco próprio
        if: (github.ref_name == 'feat/p64-6-finalizacao-interface-homologacao-operacional' || (github.ref_name == 'feat/p64-9-reconstrucao-integral-interface-consumer' || github.ref_name == 'feat/p64-7-reconstrucao-completa-interface-consumer' || github.ref_name == 'feat/p64-8-correcao-final-homologacao'))
        run: |
          set -o pipefail
          export DB_NAME=apollo_p40_browser_p646_offline
          python local-server/gerar-certificado.py /tmp/apollo-p41-tls 127.0.0.1
          sudo cp /tmp/apollo-p41-tls/apollo-local-ca.crt /usr/local/share/ca-certificates/apollo-p646.crt
          sudo update-ca-certificates
          if [[ "$P47_BROWSER" == firefox ]]; then
            sudo apt-get install -y libnss3-tools
            mkdir -p "$HOME/.pki/nssdb"
            certutil -N -d "sql:$HOME/.pki/nssdb" --empty-password
            certutil -A -d "sql:$HOME/.pki/nssdb" -n Apollo-P646-disposable-CA -t "C,," -i /tmp/apollo-p41-tls/apollo-local-ca.crt
          fi
          export APOLLO_TEST_TLS_SPKI="$(openssl x509 -in /tmp/apollo-p41-tls/server.crt -pubkey -noout | openssl pkey -pubin -outform der | openssl dgst -sha256 -binary | openssl base64)"
          python backend/p40_seed_ci.py
          (
            cd backend
            exec python -m uvicorn server:app --host 127.0.0.1 --port 8001 --ssl-keyfile /tmp/apollo-p41-tls/server.key --ssl-certfile /tmp/apollo-p41-tls/server.crt
          ) > evidence/offline-backend.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --retry 15 --retry-connrefused --retry-delay 1 --cacert /tmp/apollo-p41-tls/apollo-local-ca.crt -fsS "$APOLLO_E2E_BASE_URL/api/" >/dev/null
          cd tests
          npx playwright test --config=p47.config.ts p55-offline-tables.spec.ts --output=test-results/p646-offline --reporter=list --trace retain-on-failure | tee ../evidence/p646-offline.log
      - name: Testar carga e conciliação em banco separado
        if: (github.ref_name == 'feat/p64-6-finalizacao-interface-homologacao-operacional' || (github.ref_name == 'feat/p64-9-reconstrucao-integral-interface-consumer' || github.ref_name == 'feat/p64-7-reconstrucao-completa-interface-consumer' || github.ref_name == 'feat/p64-8-correcao-final-homologacao')) && matrix.browser == 'chromium'
        run: |
          set -o pipefail
          export DB_NAME=apollo_p40_browser_fictitious
          python backend/p40_seed_ci.py
          (
            cd backend
            exec python -m uvicorn server:app --host 127.0.0.1 --port 8001 --ssl-keyfile /tmp/apollo-p41-tls/server.key --ssl-certfile /tmp/apollo-p41-tls/server.crt
          ) > evidence/load-backend.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --retry 15 --retry-connrefused --retry-delay 1 --cacert /tmp/apollo-p41-tls/apollo-local-ca.crt -fsS "$APOLLO_E2E_BASE_URL/api/" >/dev/null
          python tools/p45-load.py | tee evidence/p646-load.log
          python tools/p45-two-cashiers.py | tee evidence/p646-cashiers.log
      - name: Compare with the previous interface
        if: (github.ref_name == 'feat/p64-9-reconstrucao-integral-interface-consumer' || github.ref_name == 'feat/p64-7-reconstrucao-completa-interface-consumer' || github.ref_name == 'feat/p64-8-correcao-final-homologacao') && matrix.browser == 'chromium'
        run: |
          set -euo pipefail
          baseline=e02b17f6c5183e78700c23d0f97f099720a6e567
          before=p646
          after=p647
          if [[ "$GITHUB_REF_NAME" == feat/p64-8-correcao-final-homologacao ]]; then
            baseline=5111b8fcda3fa53399b1c47cf870026750f8f874
            before=p647
            after=p648
          fi
          if [[ "$GITHUB_REF_NAME" == feat/p64-9-reconstrucao-integral-interface-consumer ]]; then
            baseline=196d4dcb0fb6ea8187bb1f4daa1b03d79568d7b5
            before=p648
            after=p649
          fi
          git merge-base --is-ancestor "$baseline" "$GITHUB_SHA"
          previous="$RUNNER_TEMP/apollo-p646"
          mkdir -p "$previous"
          git archive "$baseline" frontend | tar -x -C "$previous"
          ln -s "$GITHUB_WORKSPACE/frontend/node_modules" "$previous/frontend/node_modules"
          APOLLO_SOURCE_COMMIT="$baseline" npm --prefix "$previous/frontend" run build
          EXPECTED_COMMIT="$baseline" node frontend/scripts/verify-build.mjs "$previous/frontend/dist"
          compare() (
            side="$1"
            export DB_NAME="apollo_p40_browser_${side}_comparison"
            export SERVE_FRONTEND_DIR="$2"
            export APOLLO_P647_SIDE="$side"
            python backend/p40_seed_ci.py
            (
              cd backend
              exec python -m uvicorn server:app --host 127.0.0.1 --port 8001 --ssl-keyfile /tmp/apollo-p41-tls/server.key --ssl-certfile /tmp/apollo-p41-tls/server.crt
            ) > "evidence/$side-comparison-backend.log" 2>&1 &
            server_pid=$!
            stop_comparison() {
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            }
            trap stop_comparison EXIT
            curl --retry 15 --retry-connrefused --retry-delay 1 --cacert /tmp/apollo-p41-tls/apollo-local-ca.crt -fsS "$APOLLO_E2E_BASE_URL/api/" >/dev/null
            cd tests
            npx playwright test --config=p47.config.ts p647-visual-comparison.spec.ts --output="test-results/p647-comparison/$side" --reporter=list --trace retain-on-failure
          )
          compare "$before" "$previous/frontend/dist"
          compare "$after" "$GITHUB_WORKSPACE/frontend/dist"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Apollo-P63-${{ matrix.browser }}
          path: |
            tests/test-results/p47/
            tests/test-results/p646-offline/
            tests/test-results/p647-comparison/
            evidence/
          retention-days: 14
