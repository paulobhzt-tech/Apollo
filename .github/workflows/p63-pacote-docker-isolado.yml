name: P63 - Empacotar Docker para laboratorio isolado

on:
  push:
    branches:
      - feat/p64-4-finalizacao-liberacao-operacional
      - feat/p64-5-interface-consumer-operacional
      - feat/p64-6-finalizacao-interface-homologacao-operacional
      - feat/p64-7-reconstrucao-completa-interface-consumer
      - feat/p64-8-correcao-final-homologacao
      - feat/p64-9-reconstrucao-integral-interface-consumer
      - audit/p63-pacote-docker-isolado
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pacote-docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Obter commit fixado
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Node para verificar manifesto
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compilar imagem P63 sem publicar
        shell: bash
        run: |
          set -euo pipefail
          docker build --build-arg APOLLO_SOURCE_COMMIT="$GITHUB_SHA" \
            --tag "apollo-p63-candidata:$GITHUB_SHA" .
          mkdir -p "$RUNNER_TEMP/p63-web" pacote
          container="$(docker create "apollo-p63-candidata:$GITHUB_SHA")"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "$container:/app/web/." "$RUNNER_TEMP/p63-web/"
          EXPECTED_COMMIT="$GITHUB_SHA" node frontend/scripts/verify-build.mjs "$RUNNER_TEMP/p63-web"
          cp "$RUNNER_TEMP/p63-web/build-integrity.json" pacote/build-integrity.json

      - name: Ensaiar rollback e restauração com banco fictício
        if: github.ref_name == 'feat/p64-9-reconstrucao-integral-interface-consumer' || (github.ref_name == 'feat/p64-7-reconstrucao-completa-interface-consumer' || github.ref_name == 'feat/p64-8-correcao-final-homologacao') || github.ref_name == 'feat/p64-6-finalizacao-interface-homologacao-operacional' || github.ref_name == 'feat/p64-5-interface-consumer-operacional' || github.ref_name == 'feat/p63-final-consolidacao-operacional' || github.ref_name == 'feat/p64-3-interface-impressao-final' || contains(fromJSON('["feat/p64-4-liberacao-final-apollo","feat/p64-4-finalizacao-liberacao-operacional"]'), github.ref_name)
        shell: bash
        env:
          ROLLBACK_SHA: ${{ github.ref_name == 'feat/p64-9-reconstrucao-integral-interface-consumer' && '196d4dcb0fb6ea8187bb1f4daa1b03d79568d7b5' || github.ref_name == 'feat/p64-8-correcao-final-homologacao' && '5111b8fcda3fa53399b1c47cf870026750f8f874' || github.ref_name == 'feat/p64-7-reconstrucao-completa-interface-consumer' && 'e02b17f6c5183e78700c23d0f97f099720a6e567' || (github.ref_name == 'feat/p64-6-finalizacao-interface-homologacao-operacional' || github.ref_name == 'feat/p64-5-interface-consumer-operacional') && '5c35f5e924c44abdeb656ec9587542ce1a53a860' || contains(fromJSON('["feat/p64-4-liberacao-final-apollo","feat/p64-4-finalizacao-liberacao-operacional"]'), github.ref_name) && 'fe85d9ce5fd52ca81cf1a6d020706b1fb50ad972' || github.ref_name == 'feat/p64-3-interface-impressao-final' && 'a116da3d21a397c3a2bbf84d596c77d0b236fb22' || '6795a35d4b7d7a6d539fb5fa6da3b66b25f84f11' }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$ROLLBACK_SHA" "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/p63-base"
          git archive "$ROLLBACK_SHA" | tar -xf - -C "$RUNNER_TEMP/p63-base"
          docker build --build-arg APOLLO_SOURCE_COMMIT="$ROLLBACK_SHA" \
            --tag "apollo-p63-rollback:$ROLLBACK_SHA" "$RUNNER_TEMP/p63-base"
          bash deploy/vps/test-p63-rollback.sh "apollo-p63-candidata:$GITHUB_SHA" \
            "apollo-p63-rollback:$ROLLBACK_SHA" pacote/ensaio
          docker save "apollo-p63-rollback:$ROLLBACK_SHA" | gzip -1 > pacote/Apollo-P63-Rollback.tar.gz
          gzip -t pacote/Apollo-P63-Rollback.tar.gz
          (cd pacote && sha256sum Apollo-P63-Rollback.tar.gz > SHA256ROLLBACK.txt)

      - name: Empacotar Web e PWA
        shell: bash
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/p63-web" && zip -q -r "$GITHUB_WORKSPACE/pacote/Apollo-P63-Web-PWA.zip" .)
          (cd pacote && sha256sum Apollo-P63-Web-PWA.zip > SHA256WEB.txt)

      - name: Empacotar imagem Docker de forma verificavel
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect "apollo-p63-candidata:$GITHUB_SHA" --format '{{.Id}}' > pacote/docker-image-id.txt
          printf '%s\n' "$GITHUB_SHA" > pacote/source-commit.txt
          docker save "apollo-p63-candidata:$GITHUB_SHA" | gzip -1 > pacote/Apollo-P63-Espeteria-Candidata.tar.gz
          gzip -t pacote/Apollo-P63-Espeteria-Candidata.tar.gz
          (cd pacote && sha256sum Apollo-P63-Espeteria-Candidata.tar.gz build-integrity.json docker-image-id.txt source-commit.txt > SHA256SUMS.txt)
          ls -lh pacote/
          cat pacote/source-commit.txt pacote/docker-image-id.txt

      - name: Disponibilizar pacote apenas como artefato de CI
        uses: actions/upload-artifact@v4
        with:
          name: Apollo-P63-Docker-${{ github.sha }}
          path: pacote/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
