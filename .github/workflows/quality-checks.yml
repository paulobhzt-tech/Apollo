name: Apollo - Bateria de testes

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: apollo_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar sintaxe Python
        run: python -m compileall -q .
      - name: Instalar dependencias (incluindo indice Emergent)
        run: python -m pip install -r requirements.txt --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
      - name: Testes isolados de autenticacao, CSRF e protecao de dados
        run: python -m pytest -q -n 0 tests/test_auth_security.py tests/test_bootstrap_security.py tests/test_csrf_origin.py tests/test_demo_guard.py tests/test_offline_replay.py tests/test_counter_payment_unit.py tests/test_serverbackup_integrity.py tests/test_ingredient_edit_concurrency.py tests/test_inventory_concurrency.py tests/test_operational_audit.py tests/test_kds_workflow.py tests/test_stock_replenishment.py tests/test_backup_health.py tests/test_sync_identity.py tests/test_audit_alerts.py tests/test_inventory_forecast.py tests/test_restore_disposable_integration.py tests/test_restore_recovery.py tests/test_inventory_recovery.py tests/test_commercial_plans.py tests/test_finance_bill_atomic.py tests/test_public_qr_security.py tests/test_table_item_submission.py

  pagamentos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      MONGO_URL: mongodb://127.0.0.1:27017/?replicaSet=rs0
      DB_NAME: apollo_partial_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias (incluindo indice Emergent)
        run: python -m pip install -r requirements.txt --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
      - name: Criar MongoDB de testes com transacoes
        run: |
          docker run -d --name apollo-test-mongo -p 127.0.0.1:27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 40); do
            if docker exec apollo-test-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec apollo-test-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 40); do
            if docker exec apollo-test-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Testar pagamentos parciais, concorrencia e juncao de mesas
        run: python -m pytest -q -n 0 tests/test_partial_payment_integration.py tests/test_table_merge_integration.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias com Yarn (gerenciador do projeto)
        run: yarn install --non-interactive
      - name: Executar testes de filas offline e reconciliacao (Vitest)
        run: yarn vitest run src/lib/offline.test.ts src/lib/queue-context.test.ts src/lib/legacy-reconciliation.test.ts
      - name: Verificar tipos TypeScript
        run: yarn typecheck
      - name: Compilar interface
        run: yarn build

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe Electron
        run: |
          node --check main.js
          node --check preload.js
          node --check scripts/build-web.js
          node --check durable-store.js
          node --test scripts/server-connection.test.js scripts/durable-store.test.js scripts/exit-queue.test.js

  restore-disposable:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: apollo_restore_test_${{ github.run_id }}_${{ github.run_attempt }}
      APOLLO_ALLOW_DISPOSABLE_RESTORE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias dos testes de restauracao isolada
        run: python -m pip install pytest pytest-xdist pytest-asyncio httpx fastapi motor pymongo python-dotenv bcrypt
      - name: Iniciar MongoDB descartavel sem dados existentes
        run: |
          docker run -d --name apollo-restore-mongo -p 127.0.0.1:27017:27017 mongo:7 --bind_ip_all
          for i in $(seq 1 40); do
            if docker exec apollo-restore-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Testar backup e restauracao real apenas no banco descartavel
        run: python -m pytest -q -n 0 tests/test_restore_disposable_integration.py tests/test_admin_access_integration.py tests/test_catalog_standalone.py tests/test_print_queue_integration.py
      - name: Remover apenas container descartavel desta execucao
        if: always()
        run: docker rm -f apollo-restore-mongo || true
