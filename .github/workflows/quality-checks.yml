name: Apollo - Bateria de testes

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: apollo_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar sintaxe Python
        run: python -m compileall -q .
      - name: Instalar dependencias (incluindo indice Emergent)
        run: python -m pip install -r requirements.txt --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
      - name: Testes isolados de autenticacao, CSRF e protecao de dados
        run: python -m pytest -q -n 0 tests/test_auth_security.py tests/test_csrf_origin.py tests/test_demo_guard.py tests/test_role_permissions.py tests/test_frontend_paths.py tests/test_auth_nonblocking.py tests/test_backup_credentials.py tests/test_transaction_metrics.py

  pagamentos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      MONGO_URL: mongodb://127.0.0.1:27017/?replicaSet=rs0
      DB_NAME: apollo_partial_ci
      APOLLO_P0_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias (incluindo indice Emergent)
        run: python -m pip install -r requirements.txt --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
      - name: Criar MongoDB de testes com transacoes
        run: |
          docker run -d --name apollo-test-mongo -p 127.0.0.1:27017:27017 mongo:7 --replSet rs0 --bind_ip_all --setParameter enableTestCommands=1 --setParameter transactionLifetimeLimitSeconds=5
          for i in $(seq 1 40); do
            if docker exec apollo-test-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec apollo-test-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 40); do
            if docker exec apollo-test-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Testar pagamentos parciais e concorrencia
        run: python -m pytest -q -n 0 tests/test_partial_payment_integration.py tests/test_p0_atomicity_integration.py tests/test_p1_integrity_integration.py tests/test_reconciliation.py tests/test_contention_integration.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regressao da fila offline
        run: node --experimental-vm-modules --test tests/offline-queue.test.mjs
      - name: Instalar dependencias com Yarn (gerenciador do projeto)
        run: yarn install --non-interactive
      - name: Verificar tipos TypeScript
        run: yarn typecheck
      - name: Compilar interface
        run: yarn build

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe Electron
        run: |
          node --check main.js
          node --check preload.js
          node --check scripts/build-web.js

  recovery-failover:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar driver de homologacao
        run: python -m pip install motor==3.7.1 pymongo==4.18.2 fastapi python-dotenv
      - name: Preparar MongoDB descartavel
        run: |
          curl --fail --retry 3 -o /tmp/mongo.tgz https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2204-7.0.16.tgz
          tar -xzf /tmp/mongo.tgz -C /tmp
      - name: Failover real autenticado com tres membros
        env:
          MONGOD_BIN: /tmp/mongodb-linux-x86_64-ubuntu2204-7.0.16/bin/mongod
        run: python tools/test_replica_failover.py /tmp/apollo-failover.json
