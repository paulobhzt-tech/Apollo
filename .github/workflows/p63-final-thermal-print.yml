name: P63 final - regressao impressao termica
on:
  push:
    branches: [feat/p63-final-consolidacao-operacional]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  thermal-print:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe do desktop
        run: node --check desktop/main.js
      - name: Executar testes simulados de impressao
        run: node --test desktop/thermal-print.test.js
      - name: Verificar sintaxe do Print Lite no Windows PowerShell
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'desktop/scripts/apollo-print-lite.ps1'),
            [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }
