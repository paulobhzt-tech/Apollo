name: Apollo P57 Windows virtual UI
on:
  push:
    branches: [audit/p57-correcao-vps-offline-liberacao, audit/p58-correcao-definitiva-vps-pwa-homologacao]
    paths: ['.github/workflows/p57-windows-ui.yml', 'frontend/**', 'tests/**']
permissions:
  contents: read
jobs:
  windows-ui:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build public Web app
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm run build
      - name: Install virtual browser
        working-directory: tests
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium
      - name: Exercise operator access, lock and desktop layouts
        working-directory: tests
        run: npx playwright test --config=p57-windows.config.ts operator-session.spec.ts --project=desktop --grep 'login, recuperação|bloqueio continua|faixa, tema, zoom|menu compacto' --trace on
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Apollo-P57-Windows-Server-2022-simulated-UI
          path: tests/test-results/
          retention-days: 14
