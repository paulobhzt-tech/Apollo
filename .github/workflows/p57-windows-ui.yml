name: Apollo P57 Windows virtual UI
on:
  push:
    branches: [audit/p57-correcao-vps-offline-liberacao]
    paths: ['.github/workflows/p57-windows-ui.yml', 'frontend/**', 'tests/**']
permissions:
  contents: read
jobs:
  windows-ui:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build public Web app
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm run build
      - name: Install virtual browser
        working-directory: tests
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium
      - name: Exercise operator access, lock and desktop layouts
        shell: pwsh
        run: |
          $preview = Start-Process node -ArgumentList 'node_modules/vite/bin/vite.js','preview','--host','127.0.0.1','--port','3000','--strictPort' -WorkingDirectory frontend -PassThru
          try {
            $ready = $false
            foreach ($i in 1..30) {
              try {
                $response = Invoke-WebRequest -Uri http://localhost:3000/ -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Preview unavailable' }
            Set-Location tests
            npx playwright test operator-session.spec.ts --project=desktop --grep 'login, recuperação|bloqueio continua|faixa, tema, zoom|menu compacto' --trace on
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Stop-Process -Id $preview.Id -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Apollo-P57-Windows-Server-2022-simulated-UI
          path: tests/test-results/
          retention-days: 14
