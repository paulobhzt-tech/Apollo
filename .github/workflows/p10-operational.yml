name: P10 - Isolated operational Web validation
on:
  push:
    branches: ["homolog/p10-operational-web"]
    paths: ["backend/**", "frontend/**", "tests/**", "desktop/**", "deploy/p10/**", ".github/workflows/p10-operational.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p10-operational-${{ github.ref }}
  cancel-in-progress: false
jobs:
  real-web:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, notebook, tablet, mobile]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Isolated test dependencies and MongoDB 7.0.16
        run: |
          python -m pip install fastapi==0.141.1 uvicorn==0.54.0 motor==3.7.1 pymongo==4.18.2 bcrypt==4.0.1 python-dotenv pytest pytest-xdist pytest-asyncio pytest-subtests httpx python-multipart email-validator google-api-python-client google-auth-oauthlib requests pandas
          npm --prefix frontend install --ignore-scripts --package-lock=false --no-audit
          npm --prefix tests install --ignore-scripts --package-lock=false --no-audit
          cd tests
          npx playwright install --with-deps chromium
          curl -fL https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2204-7.0.16.tgz -o /tmp/p10-mongo.tgz
          tar -xzf /tmp/p10-mongo.tgz -C /tmp
      - name: Build Web and preserve P6 real browser financial scenarios
        env:
          MONGOD_BIN: /tmp/mongodb-linux-x86_64-ubuntu2204-7.0.16/bin/mongod
          APOLLO_WEB_EVIDENCE_DIR: ${{ github.workspace }}/docs/web/p10-2026-11-16/evidence/p6-${{ matrix.project }}
        run: |
          cd frontend
          npx vite build --config vite.web.config.ts
          cd ..
          python backend/tools/run_p6_web.py --project ${{ matrix.project }}
      - name: P10 built Web HTTPS operational security accessibility and restart scenarios
        env:
          MONGOD_BIN: /tmp/mongodb-linux-x86_64-ubuntu2204-7.0.16/bin/mongod
          P10_EVIDENCE: ${{ github.workspace }}/docs/web/p10-2026-11-16/evidence/p10-${{ matrix.project }}
        run: python backend/tools/run_p10_web.py --project ${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p10-real-web-${{ matrix.project }}-${{ github.sha }}
          retention-days: 90
          path: |
            docs/web/p10-2026-11-16/evidence
            tests/test-results/p10
            tests/test-results/p6
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MONGOD_BIN: /tmp/mongodb-linux-x86_64-ubuntu2204-7.0.16/bin/mongod
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Test dependencies
        run: |
          python -m pip install fastapi==0.141.1 uvicorn==0.54.0 motor==3.7.1 pymongo==4.18.2 bcrypt==4.0.1 python-dotenv pytest pytest-xdist pytest-asyncio pytest-subtests httpx python-multipart email-validator google-api-python-client google-auth-oauthlib requests pandas
          npm --prefix frontend install --ignore-scripts --package-lock=false --no-audit
          npm --prefix tests install --ignore-scripts --package-lock=false --no-audit
          cd tests
          npx playwright install --with-deps chromium
          curl -fL https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2204-7.0.16.tgz -o /tmp/p10-mongo.tgz
          tar -xzf /tmp/p10-mongo.tgz -C /tmp
      - name: Financial security recovery regressions on a disposable replica set
        run: |
          set -o pipefail
          mkdir -p docs/web/p10-2026-11-16/evidence/regression
          python backend/tools/run_replica_tests.py --http -q tests | tee docs/web/p10-2026-11-16/evidence/regression/backend.txt
          python backend/tools/test_replica_failover.py docs/web/p10-2026-11-16/evidence/regression/failover.json | tee docs/web/p10-2026-11-16/evidence/regression/failover.txt
      - name: Types lint Web Electron frontend and Node regressions
        run: |
          npm --prefix frontend run typecheck
          npm --prefix frontend run lint
          npm --prefix frontend run build
          cd frontend
          npx vite build --config vite.web.config.ts
          node --experimental-vm-modules --test tests/offline-queue.test.mjs tests/web-sale-recovery.test.mjs tests/browser-print.test.mjs
          cd ..
          node --check desktop/main.js
          node --check desktop/preload.js
          node --check desktop/scripts/build-web.js
      - name: Preserve P5 browser suite
        run: |
          cd frontend
          ./node_modules/.bin/vite --config vite.web.config.ts >/tmp/p10-p5-vite.log 2>&1 &
          P10_VITE_PID=$!
          trap 'kill "$P10_VITE_PID" 2>/dev/null || true' EXIT
          cd ../tests
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:3001/login >/dev/null; then break; fi; sleep 1; done
          npx playwright test --config p5.playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p10-regression-${{ github.sha }}
          retention-days: 90
          path: |
            docs/web/p10-2026-11-16/evidence/regression
            tests/test-results/p5
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Private Docker image authenticated Mongo and verified TLS proxy
        run: |
          python -m pip install httpx==0.28.1
          python backend/tools/p10_container_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p10-container-${{ github.sha }}
          retention-days: 90
          path: docs/web/p10-2026-11-16/evidence/container
