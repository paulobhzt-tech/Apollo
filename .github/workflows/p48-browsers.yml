name: Apollo six-profile browser operational matrix
on:
  push:
    branches: [audit/p48-correcao-vps-offline-liberacao, audit/p49-offline-vps-homologacao-final, audit/p50-correcao-offline-vps-liberacao-final, audit/p51-offline-total-vps-homologacao, audit/p52-pwa-offline-integral-vps-validacao, audit/p53-correcao-offline-vps-homologacao, audit/p54-offline-integral-vps-validacao-final, audit/p55-correcao-final-offline-vps-operacional, audit/p56-validacao-vps-offline-operacional, audit/p57-correcao-vps-offline-liberacao, audit/p58-vps-validacao-operacional-final]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, chrome, msedge, android, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MONGO_URL: mongodb://127.0.0.1:27017/?replicaSet=rs0
      DB_NAME: apollo_p40_browser_fictitious
      APOLLO_CASH_MODE: operator
      COOKIE_SECURE: 'true'
      CORS_ORIGINS: https://127.0.0.1:8001
      SERVE_FRONTEND_DIR: ${{ github.workspace }}/frontend/dist
      P47_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Disposable database and dependencies
        run: |
          set -o pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          docker run -d --name p48-mongo -p 127.0.0.1:27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 60); do
            if docker exec p48-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec p48-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 60); do
            if docker exec p48-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then break; fi
            sleep 1
          done
          python -m pip install --upgrade 'setuptools>=84.1.0'
          python -m pip install -r backend/requirements.txt --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
          cd frontend
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm run build
          cd ../tests
          npm ci --no-audit --no-fund
          if test "$P47_BROWSER" = android; then
            npx playwright install --with-deps chrome
          else
            npx playwright install --with-deps "$P47_BROWSER"
          fi
      - name: Start real backend and run operational browser tests
        run: |
          set -o pipefail
          python local-server/gerar-certificado.py /tmp/apollo-p41-tls 127.0.0.1
          if test "$GITHUB_REF_NAME" = audit/p55-correcao-final-offline-vps-operacional || test "$GITHUB_REF_NAME" = audit/p56-validacao-vps-offline-operacional || test "$GITHUB_REF_NAME" = audit/p57-correcao-vps-offline-liberacao || test "$GITHUB_REF_NAME" = audit/p58-vps-validacao-operacional-final; then
            APOLLO_TEST_TLS_SPKI="$(openssl x509 -in /tmp/apollo-p41-tls/server.crt -pubkey -noout | openssl pkey -pubin -outform der | openssl dgst -sha256 -binary | openssl base64)"
            export APOLLO_TEST_TLS_SPKI
            printf 'APOLLO_TEST_TLS_SPKI=%s\n' "$APOLLO_TEST_TLS_SPKI" >> "$GITHUB_ENV"
          fi
          sudo cp /tmp/apollo-p41-tls/apollo-local-ca.crt /usr/local/share/ca-certificates/apollo-p48.crt
          sudo update-ca-certificates
          sudo apt-get install -y libnss3-tools
          mkdir -p "$HOME/.pki/nssdb"
          certutil -N -d "sql:$HOME/.pki/nssdb" --empty-password
          certutil -A -d "sql:$HOME/.pki/nssdb" -n Apollo-P48-disposable-CA -t "C,," -i /tmp/apollo-p41-tls/apollo-local-ca.crt
          python backend/p40_seed_ci.py
          cd backend
          python -m uvicorn server:app --host 127.0.0.1 --port 8001 --ssl-keyfile /tmp/apollo-p41-tls/server.key --ssl-certfile /tmp/apollo-p41-tls/server.crt > ../evidence/backend.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid"' EXIT
          cd ../tests
          for i in $(seq 1 60); do
            if curl --cacert /tmp/apollo-p41-tls/apollo-local-ca.crt -fsS https://127.0.0.1:8001/api/ > ../evidence/health.json; then break; fi
            sleep 1
          done
          curl --cacert /tmp/apollo-p41-tls/apollo-local-ca.crt -fsS https://127.0.0.1:8001/api/ >/dev/null
          if test "$GITHUB_REF_NAME" = audit/p56-validacao-vps-offline-operacional || test "$GITHUB_REF_NAME" = audit/p57-correcao-vps-offline-liberacao || test "$GITHUB_REF_NAME" = audit/p58-vps-validacao-operacional-final; then export APOLLO_P56_REVIEW=1; fi
          if test "$GITHUB_REF_NAME" = audit/p57-correcao-vps-offline-liberacao || test "$GITHUB_REF_NAME" = audit/p58-vps-validacao-operacional-final; then export APOLLO_P57_ONLINE_GUARD=1; fi
          if test "$GITHUB_REF_NAME" = audit/p58-vps-validacao-operacional-final && test "$P47_BROWSER" = chromium; then export APOLLO_P58_PAYMENT_REVIEW=1; fi
          result=0
          npx playwright test --config=p47.config.ts p43-operational-ui.spec.ts p47-browser.spec.ts 2>&1 | tee ../evidence/browser.log || result=1
          if test "$GITHUB_REF_NAME" = audit/p54-offline-integral-vps-validacao-final; then
            npx playwright test --config=p47.config.ts p54-offline-tables.spec.ts --output=test-results/p54-vault --reporter=list 2>&1 | tee ../evidence/p54-vault.log || result=1
          fi
          if test "$GITHUB_REF_NAME" = audit/p55-correcao-final-offline-vps-operacional || test "$GITHUB_REF_NAME" = audit/p56-validacao-vps-offline-operacional || test "$GITHUB_REF_NAME" = audit/p57-correcao-vps-offline-liberacao || test "$GITHUB_REF_NAME" = audit/p58-vps-validacao-operacional-final; then
            npx playwright test --config=p47.config.ts p55-offline-tables.spec.ts --output=test-results/p55-vault --reporter=list 2>&1 | tee ../evidence/p55-vault.log || result=1
          fi
          if test "$GITHUB_REF_NAME" = audit/p58-vps-validacao-operacional-final && test "$P47_BROWSER" = chromium; then
            kill "$backend_pid"
            wait "$backend_pid" || true
            export DB_NAME=apollo_p40_browser_p58_integrated
            python ../backend/p40_seed_ci.py
            (cd ../backend && exec python -m uvicorn server:app --host 127.0.0.1 --port 8001 --ssl-keyfile /tmp/apollo-p41-tls/server.key --ssl-certfile /tmp/apollo-p41-tls/server.crt) > ../evidence/p58-backend.log 2>&1 &
            backend_pid=$!
            for i in $(seq 1 30); do
              if curl --cacert /tmp/apollo-p41-tls/apollo-local-ca.crt -fsS https://127.0.0.1:8001/api/ >/dev/null; then break; fi
              sleep 1
            done
            curl --cacert /tmp/apollo-p41-tls/apollo-local-ca.crt -fsS https://127.0.0.1:8001/api/ >/dev/null
            npx playwright test --config=p47.config.ts p58-integrated-shift.spec.ts --output=test-results/p58-integrated --reporter=list 2>&1 | tee ../evidence/p58-integrated.log || result=1
          fi
          exit "$result"
      - name: Real server interruption diagnostic (separate from emulated offline)
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cd tests
          npx playwright test --config=p47.config.ts p48-offline-interruption.spec.ts --output=test-results/p48-interruption --reporter=list 2>&1 | tee ../evidence/interruption.log
      - name: Record scope
        if: always()
        run: |
          echo "Apollo browser $P47_BROWSER on disposable Linux runner. Android and iPhone are emulated. Disposable TLS CA installed; browser contexts also ignore local TLS errors; public VPS TLS is a separate check. No physical installation, real hardware, production requests or VPS login." > evidence/SCOPE.txt
          find evidence -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Apollo-browser-${{ matrix.browser }}
          path: |
            evidence/
            tests/test-results/p47/
            tests/test-results/p54-vault/
            tests/test-results/p55-vault/
            tests/test-results/p48-interruption/
          retention-days: 14
