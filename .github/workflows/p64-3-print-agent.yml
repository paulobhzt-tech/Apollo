name: Apollo Windows Print Agent
on:
  push:
    branches: [feat/p64-3-interface-impressao-final, feat/p64-4-liberacao-final-apollo, feat/p64-4-finalizacao-liberacao-operacional, feat/p64-5-interface-consumer-operacional]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validar PowerShell 5.1 e compilar código Windows sem imprimir
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          foreach ($script in @('apollo-print-agent.ps1', 'apollo-print-agent-task.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path (Get-Location) "desktop/scripts/$script"), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors) { throw ($errors | Out-String) }
          }
          Add-Type -Path desktop/scripts/ApolloAgentReceipt.cs -ReferencedAssemblies System.Drawing
          if (-not [ApolloAgentReceipt].GetMethod('Submit')) { throw 'Método de impressão indisponível.' }
      - name: Exercitar registro e remoção do autoinício em perfil fictício
        if: contains(fromJSON('["feat/p64-4-liberacao-final-apollo","feat/p64-4-finalizacao-liberacao-operacional","feat/p64-5-interface-consumer-operacional"]'), github.ref_name)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $profileName = 'ci-' + $env:GITHUB_RUN_ID
          $profileDir = Join-Path $env:LOCALAPPDATA "ApolloPrintAgent/profiles/$profileName"
          New-Item -ItemType Directory -Path $profileDir -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $profileDir 'terminal.json') -Value '{}'
          $helper = './desktop/scripts/apollo-print-agent-task.ps1'
          try {
            & $helper -Action Register -Profile $profileName
            $status = & $helper -Action Status -Profile $profileName
            if ($status.State -eq 'Unregistered' -or $status.Pending) { throw 'Tarefa nao registrada corretamente.' }
            & $helper -Action Remove -Profile $profileName
            if ((& $helper -Action Status -Profile $profileName).State -ne 'Unregistered') { throw 'Tarefa residual.' }
          } finally {
            Remove-Item -LiteralPath $profileDir -Recurse -Force
          }
      - name: Empacotar agente de homologação e gerar SHA-256
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path package
          Compress-Archive -Path desktop/scripts/apollo-print-agent.ps1,desktop/scripts/apollo-print-agent-task.ps1,desktop/scripts/ApolloAgentReceipt.cs,docs/homologacao/P64-3-PRINT-AGENT.md -DestinationPath package/Apollo-Print-Agent.zip
          Get-FileHash package/Apollo-Print-Agent.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  Apollo-Print-Agent.zip" } | Set-Content -Encoding ascii package/SHA256SUMS.txt
          Set-Content -Encoding ascii package/SOURCE.txt $env:GITHUB_SHA
      - uses: actions/upload-artifact@v4
        with:
          name: Apollo-Print-Agent-${{ github.sha }}
          path: package/
          if-no-files-found: error
