name: Apollo PWA validation
on:
  push:
    branches: [fix/windows-production-server, feat/apollo-3.0.1-caixa-offline-auditoria]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pwa-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest pytest-xdist pytest-asyncio httpx fastapi pydantic
      - name: PWA security regression checks
        run: python -m pytest backend/tests/test_pwa_static.py -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies without Emergent preview-only packages
        run: |
          npm pkg delete 'devDependencies.@emergentbase/overlay' 'devDependencies.@emergentbase/visual-edits'
          npm install --no-audit --no-fund --legacy-peer-deps
      - name: Testar fila offline
        run: npx vitest run
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Instalar Chromium para testes de interface
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Testar login, troca de operador e atendimento
        run: |
          npm run preview -- --host 127.0.0.1 --port 3000 > /tmp/apollo-preview.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:3000/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/ >/dev/null
          cd ../tests
          npx playwright test --project=desktop --project=mobile
