name: Validacao de seguranca e compilacao do Apollo PDV

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  backend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias para testes isolados
        run: python -m pip install pytest pytest-xdist pytest-asyncio httpx fastapi starlette motor pymongo python-dotenv bcrypt cryptography
      - name: Verificar sintaxe Python de todo backend
        run: python -m compileall -q backend management local-server/gerar-certificado.py
      - name: Testar protecao CSRF e autenticacao
        working-directory: backend
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: apollo_ci
        run: pytest -q -n 0 tests/test_csrf_origin.py tests/test_auth_security.py tests/test_demo_guard.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependencias
        working-directory: frontend
        run: yarn install
      - name: Verificar TypeScript
        working-directory: frontend
        run: yarn typecheck
      - name: Gerar frontend
        working-directory: frontend
        run: yarn build
  local-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validar sintaxe do instalador PowerShell
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "local-server/instalar-servidor.ps1"),
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) { $errors | Out-String | Write-Error; exit 1 }
      - name: Testar emissao de certificado HTTPS local
        shell: pwsh
        run: |
          python -m pip install cryptography
          python local-server/gerar-certificado.py "$env:RUNNER_TEMP/tls" "192.168.10.10"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -c "from cryptography import x509; from pathlib import Path; import ipaddress; p=Path(r'$env:RUNNER_TEMP/tls/server.crt'); c=x509.load_pem_x509_certificate(p.read_bytes()); print(c.subject); assert ipaddress.ip_address('192.168.10.10') in c.extensions.get_extension_for_class(x509.SubjectAlternativeName).value.get_values_for_type(x509.IPAddress)"
  vps-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar sintaxe do backup da VPS
        run: bash -n deploy/vps/backup-mongo.sh
      - name: Verificar configuracao Docker Compose da VPS
        working-directory: deploy/vps
        run: |
          cp .env.example .env
          docker compose --env-file .env config --quiet
          ! docker compose --env-file .env config | grep -E '^    ports:.*27017'
      - name: Verificar ambiente de demonstracao isolado sem publicacao
        run: |
          python -m management.demo_setup --base "$RUNNER_TEMP/apollo-demo" prepare --domain demo.example.com
          cd "$RUNNER_TEMP/apollo-demo/tenants/demo-apollo"
          docker compose --env-file .env config --quiet
          test -f "$RUNNER_TEMP/apollo-demo/gateway/sites/demo-apollo.disabled"
          test ! -e "$RUNNER_TEMP/apollo-demo/gateway/sites/demo-apollo.caddy"
  commercial-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testar painel comercial (autenticacao, CSRF, pagamentos)
        run: python -m unittest management.test_panel management.test_provision management.test_backup_tenants management.test_pix_billing management.test_demo_setup -v
      - name: Compilar modulos administrativos
        run: python -m compileall -q management
