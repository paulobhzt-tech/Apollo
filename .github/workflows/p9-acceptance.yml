name: P9 - Controlled ABBA and prolonged performance acceptance
on:
  push:
    branches: ["perf/p9-financial-latency"]
    paths:
      - ".github/workflows/p9-acceptance.yml"
      - "backend/tools/run_p9_acceptance.py"
      - "docs/web/p9-2026-11-16/ACCEPTANCE.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p9-acceptance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  financial-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      MONGOD_BIN: /tmp/mongodb-linux-x86_64-ubuntu2204-7.0.16/bin/mongod
      P8_BASELINE_ROOT: ${{ github.workspace }}/.p9-p8-base
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: e670c5e24321cc6bc1de69348da3d55bc7730887
          path: .p9-p8-base
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install the same isolated runtime for both versions
        run: |
          python -m pip install fastapi==0.141.1 uvicorn==0.54.0 motor==3.7.1 pymongo==4.18.2 bcrypt==4.0.1 httpx==0.28.1 pytest==9.2.0 python-dotenv pytest-xdist pytest-asyncio pytest-subtests python-multipart email-validator google-api-python-client google-auth-oauthlib requests pandas
          curl -fL https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2204-7.0.16.tgz -o /tmp/p8-mongo.tgz
          tar -xzf /tmp/p8-mongo.tgz -C /tmp
          mkdir -p docs/web/p8-2026-11-16/evidence
          python -m pip freeze > docs/web/p8-2026-11-16/evidence/runtime-packages.txt
          cmp docs/web/p9-2026-11-16/ACCEPTANCE.json .p9-p8-base/docs/web/p8-2026-11-16/ACCEPTANCE.json
          python -m py_compile backend/tools/run_p9_acceptance.py
      - name: Controlled history ABBA and 1800 seconds per version
        run: |
          set -o pipefail
          mkdir -p docs/web/p9-2026-11-16/evidence
          python backend/tools/run_p9_acceptance.py | tee docs/web/p9-2026-11-16/evidence/acceptance.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p9-controlled-financial-${{ github.sha }}
          retention-days: 90
          path: |
            docs/web/p9-2026-11-16
            docs/web/p8-2026-11-16/evidence/load-p9*
            docs/web/p8-2026-11-16/evidence/driver-p9*
            docs/web/p8-2026-11-16/evidence/indexes-p9*
            docs/web/p8-2026-11-16/evidence/execution-timeline.jsonl
