name: P43 locked installation verification
on:
  push:
    branches: [audit/p43-desbloqueio-homologacao-web]
    paths:
      - .github/workflows/p43-lockfiles.yml
      - frontend/package.json
      - frontend/package-lock.json
      - tests/package.json
      - tests/package-lock.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  locked-installation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install immutable frontend graph, audit and build
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm audit --audit-level=moderate
          npm run typecheck
          npm run build
      - name: Install immutable browser test graph
        working-directory: tests
        run: npm ci --no-audit --no-fund
      - name: Ensure installation did not rewrite manifests or locks
        run: |
          git diff --exit-code -- frontend/package.json frontend/package-lock.json tests/package.json tests/package-lock.json
