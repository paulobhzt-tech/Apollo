# ISOLATED HOMOLOGATION ONLY. Never apply to a shared VPS without explicit approval.
services:
 p10-mongo:
  image: mongo:7.0.16
  hostname: p10-mongo
  entrypoint: ["bash", "/opt/p10/start-mongo.sh"]
  command: ["mongod", "--replSet", "p10", "--bind_ip_all", "--auth", "--keyFile", "/data/configdb/replica.key", "--wiredTigerCacheSizeGB", "0.25"]
  environment:
   MONGO_INITDB_ROOT_USERNAME: p10_root
   MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/root_password
  volumes:
   - p10_data:/data/db
   - ../homologation/start-mongo.sh:/opt/p10/start-mongo.sh:ro
   - ./mongo-init.js:/docker-entrypoint-initdb.d/10-p10.js:ro
   - ./replica-init.js:/opt/p10/replica-init.js:ro
   - ${P10_SECRETS_DIR:?Generate new isolated P10 secrets}/replica.key:/run/secrets/replica.key:ro
   - ${P10_SECRETS_DIR}/root_password:/run/secrets/root_password:ro
   - ${P10_SECRETS_DIR}/mongo_password:/run/secrets/mongo_password:ro
  networks:
   private: {ipv4_address: 172.31.240.3}
  mem_limit: 768m
  cpus: 1.0
  healthcheck:
   test: ["CMD-SHELL", "mongosh --quiet --eval \"const fs=require('fs');db.getSiblingDB('admin').auth('p10_root',fs.readFileSync('/run/secrets/root_password','utf8').trim());db.adminCommand({ping:1})\" >/dev/null"]
   interval: 5s
   timeout: 5s
   retries: 30
 web:
  build: {context: ../.., dockerfile: deploy/p10/Dockerfile.web}
  image: apollo-p10-web:${P10_IMAGE_TAG:-candidate}
  env_file: homologation.env.example
  environment:
   TRUSTED_PROXY_IPS: 172.31.240.1,172.31.240.4
  volumes:
   - ${P10_SECRETS_DIR}/mongo_uri:/run/secrets/mongo_uri:ro
   - ${P10_SECRETS_DIR}/bootstrap_token:/run/secrets/bootstrap_token:ro
  networks:
   private: {ipv4_address: 172.31.240.2}
  ports: ["127.0.0.1:18082:10000"]
  read_only: true
  tmpfs: ["/tmp:size=64m,mode=1777"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 384m
  cpus: 0.75
  depends_on:
   p10-mongo: {condition: service_healthy}
  healthcheck:
   test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:10000/api/health/ready',headers={'Host':'homolog.apollo-pdv.com'}),timeout=3)"]
   interval: 5s
   timeout: 4s
   retries: 30
 proxy:
  image: nginx:1.28-alpine
  profiles: [tls-test]
  user: "101:101"
  volumes:
   - ./nginx.conf:/etc/nginx/nginx.conf:ro
   - ${P10_CERTS_DIR:?Supply isolated TLS certificate directory}:/certs:ro
  ports: ["127.0.0.1:18443:8443"]
  networks:
   private: {ipv4_address: 172.31.240.4}
   edge: {}
  read_only: true
  tmpfs: ["/tmp:size=32m,mode=1777"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 128m
  cpus: 0.25
networks:
 private:
  internal: true
  ipam:
   config: [{subnet: 172.31.240.0/28}]
 edge: {}
volumes:
 p10_data:
