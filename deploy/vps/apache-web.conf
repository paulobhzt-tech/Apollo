# Include inside the HTTPS VirtualHost dedicated to the audited installation.
# Define APOLLO_DOCUMENT_ROOT and APOLLO_BACKEND_ORIGIN before this Include.
DocumentRoot "${APOLLO_DOCUMENT_ROOT}"
ProxyRequests Off
ProxyPreserveHost On
ProxyPassMatch "^(/api(?:/.*)?)$" "${APOLLO_BACKEND_ORIGIN}$1"

<Directory "${APOLLO_DOCUMENT_ROOT}">
    Require all granted
    AllowOverride None
    Options -Indexes -MultiViews
    DirectoryIndex index.html
    FallbackResource disabled
    ErrorDocument 404 default
    AddType application/json .json
    AddType application/manifest+json .webmanifest
    AddType application/javascript .js
    AddType text/css .css
    <FilesMatch "^(?:index\.html|sw\.js|manifest\.webmanifest|build-integrity\.json)$">
        Header always set Cache-Control "no-cache"
    </FilesMatch>
</Directory>

# API and asset namespaces retain their upstream or static error status.
RewriteEngine On
RewriteRule "^/(?:api|assets)(?:/|$)" "-" [END]
RewriteRule "/[^/]*\.[^/]*$" "-" [END]
RewriteCond "%{REQUEST_METHOD}" "^(?:GET|HEAD)$"
RewriteCond "%{DOCUMENT_ROOT}%{REQUEST_URI}" !-f
RewriteCond "%{DOCUMENT_ROOT}%{REQUEST_URI}" !-d
RewriteRule "^/" "/index.html" [END]
